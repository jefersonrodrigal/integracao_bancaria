[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "integracao-bancaria"
version = "0.1.0"
description = "Integração bancária de cobrança registrada — adaptador Itaú CNAB 400"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1,<0.160",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "sqlalchemy>=2.1.6,<2.2",
    "alembic>=1.20.1,<2",
    "uvicorn>=0.54.0,<0.55",
    "python-multipart>=0.0.32",
    "psycopg[binary]>=3.3.6,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["app.api.*"]
disallow_untyped_decorators = false
